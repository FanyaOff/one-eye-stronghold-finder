# Compile all supported Minecraft versions on pushes and pull requests.
name: build
on: [pull_request, push]

jobs:
  build:
    strategy:
      matrix:
        include:
          - minecraft: '1.21.8'
            java: 21
          - minecraft: '1.21.9'
            java: 21
          - minecraft: '1.21.10'
            java: 21
          - minecraft: '1.21.11'
            java: 21
          - minecraft: '26.1'
            java: 25
          - minecraft: '26.2'
            java: 25
          - minecraft: '26.3'
            java: 25
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/wrapper-validation-action@v2
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: compile client sources
        run: ./gradlew :${{ matrix.minecraft }}:compileClientJava --no-parallel
